---
name: Repository Linting

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - chore/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-repository:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-repository-linting.yaml@1a22766e05e0fc9a6a5dca46a6bce524ebe43257 # v1.1.0
    with:
      runs-on: ubuntu-latest
      app-directory: "./"
      output-file: "/tmp/kcl-repo-findings.txt"
      continue-error: "true"
      branch-name: main
      environment-name: linting
      artifact-retention-days: 30
