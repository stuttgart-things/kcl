---
name: Repository Linting

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
      - chore/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-repository:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-repository-linting.yaml@main
    with:
      # ubuntu-latest is Ubuntu 26.04 since ~2026-10-30; the Dagger engine v0.19.3
      # crash-loops there (stuttgart-things/github-workflow-templates#226).
      runs-on: ubuntu-24.04
      app-directory: "./"
      output-file: "/tmp/kcl-repo-findings.txt"
      continue-error: "true"
      branch-name: main
      dagger-version: "0.19.3"
      dagger-module-version: v1.15.0
      environment-name: linting
      artifact-retention-days: 30
