---
# Generated together with its sibling native-vm-*.yaml: keep both in step.
# The module renders the same order as the Backstage template create-vm
# (stuttgart-things/stuttgart-things hack/check-vm-kcl.py, #4295).
apiVersion: resources.stuttgart-things.com/v1alpha1
kind: ClaimTemplate
metadata:
  name: native-vm-labda-vsphere
  title: VM (labda-vsphere)
  description: vSphere VM in LabDA (NativeVsphereVM, EnvironmentConfig labda), built by machinery – same order as the Backstage template create-vm.
  tags:
    - vm
    - vsphere
    - crossplane
spec:
  type: xr-native-vm
  source: oci://ghcr.io/stuttgart-things/xr-native-vm
  tag: 0.2.1
  # Order = layout order: name, use case, the fields of the chosen use case,
  # size, who. showWhen/enumWhen (claim-machinery-api#135) hide fields that
  # do not apply and narrow size per use case; clients that do not know them
  # show every field. main.k's asserts stay the last line of defence.
  parameters:
    # Template selector: the lab decides the kind, the EnvironmentConfig and
    # the factory (machinery).
    - name: templateName
      title: Lab
      type: string
      default: labda-vsphere
      hidden: true

    - name: name
      title: VM Name
      type: string
      required: true
      default: demo
      pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
      description: "VM and hostname; the XR is named <name>-vm"

    - name: use_case
      title: Use Case
      type: string
      default: baseos
      enum:
        - baseos
        - kind
        - dev
        - rke2
        - github-runner
      description: "baseos; kind (the VM is a kind cluster); dev (developer VM, large/xlarge); rke2 (single node, not small); github-runner (org runners, large/xlarge)"

    # ---- kind
    - name: kind_workers
      title: kind Workers
      type: string
      default: "1"
      description: "kind: worker nodes of the kind cluster"
      showWhen:
        use_case: [kind]

    # ---- dev
    - name: dev_features
      title: Dev Features
      type: array
      multiselect: true
      enum:
        - toolchain
        - docker
        - go
        - kind
        - ansible
        - pre-commit
        - semantic-release
        - nerdctl
        - podman
        - claude-code
        - shell
        - vhs
        - dotfiles
      default:
        - toolchain
        - docker
        - go
        - kind
        - ansible
        - pre-commit
        - semantic-release
        - nerdctl
        - podman
        - claude-code
        - shell
        - vhs
        - dotfiles
      description: "dev: what sthings.baseos.dev installs; kind = a kind cluster inside the dev VM (installs Docker too)"
      showWhen:
        use_case: [dev]

    - name: dev_go_version
      title: Go Version
      type: string
      default: "1.27.4"
      description: "dev: Go version (feature go)"
      showWhen:
        use_case: [dev]
        dev_features: [go]

    - name: dev_kind_workers
      title: Dev kind Workers
      type: string
      default: "3"
      description: "dev: kind worker nodes of the kind cluster inside the dev VM (feature kind)"
      showWhen:
        use_case: [dev]
        dev_features: [kind]

    - name: dev_kind_name
      title: Dev kind Cluster Name
      type: string
      default: dev
      description: "dev: kind cluster name of the kind cluster inside the dev VM (feature kind)"
      showWhen:
        use_case: [dev]
        dev_features: [kind]

    # ---- github-runner
    - name: runner_labels
      title: Runner Labels
      type: string
      default: ""
      description: "github-runner: extra labels after self-hosted,Linux,X64 (comma-separated)"
      showWhen:
        use_case: [github-runner]

    - name: runner_count
      title: Runner Count
      type: string
      default: "1"
      description: "github-runner: runners on the VM"
      showWhen:
        use_case: [github-runner]

    - name: runner_toolchain
      title: Runner Tool Chain
      type: boolean
      default: true
      description: "github-runner: install the CI tool chain of the dagger runners"
      showWhen:
        use_case: [github-runner]

    - name: size
      title: Size
      type: string
      default: medium
      enum:
        - small
        - medium
        - large
        - xlarge
      description: "small 2/4G/40G, medium 4/8G/64G, large 8/16G/100G, xlarge 16/24G/200G (cpu/ram/disk)"
      # Same rules as main.k's asserts. The default medium is not allowed
      # for dev / github-runner: clients pick the first allowed value (the
      # API's /ui does); an order that omits size for those is refused (400).
      enumWhen:
        use_case:
          dev: [large, xlarge]
          github-runner: [large, xlarge]
          rke2: [medium, large, xlarge]

    # ---- who and where (stuttgart-things#4276, #4296)
    - name: owner
      title: Ordered For
      type: string
      default: ""
      description: "Backstage entity ref of the owner; empty = the orderer"
      # With order auth on, claim-machinery-api allows only the login or one
      # of its groups (an admin: any) (claim-machinery-api#122).
      identity: owner

    - name: requested_by
      title: Requested By
      type: string
      default: ""
      hidden: true
      description: "the authenticated orderer (stamped by the API)"
      # With order auth on, set from the login; another value is refused.
      identity: user

    - name: order_id
      title: Order ID
      type: string
      default: ""
      hidden: true

    - name: management_cluster
      title: Management Cluster
      type: string
      default: machinery
      hidden: true

    - name: source_path
      title: Source Path
      type: string
      default: ""
      hidden: true
      description: "empty = the factory's orders directory/<name>.yaml"

    - name: environment_config
      title: EnvironmentConfig
      type: string
      default: ""
      hidden: true
      description: "empty = the lab's"
