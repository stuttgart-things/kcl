enablePvc: true
enableCloudConfig: true
enableVm: true
name: dev5-disk-0
namespace: default
imageNamespace: default
imageId: image-t9w92
storage: 20Gi
storageClass: longhorn
# Composed as <storageClass>-<imageId> unless storageClassName is set.
# Harvester's per-image classes are named lh-<uuid>; look yours up with
#   kubectl get virtualmachineimages -n <ns> \
#     -o custom-columns='NAME:.metadata.name,SC:.status.storageClassName'
# storageClassName: lh-68e4c918-0059-48bf-acaf-0de0ebe1eb65
volumeMode: Block
accessModes: '["ReadWriteMany"]'
secretName: dev5-cloud-init # pragma: allowlist secret`
vmName: dev5
hostname: dev5
description: dev5-complete-vm-setup
osLabel: linux
runStrategy: RerunOnFailure
cpuCores: 4
cpuSockets: 1
cpuThreads: 1
memory: 8Gi
pvcName: dev5-disk-0
networkName: vms
evictionStrategy: LiveMigrateIfPossible
terminationGracePeriod: 120
